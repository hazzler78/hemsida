name = "elchef-pages"
compatibility_date = "2024-11-12"
pages_build_output_dir = ".vercel/output/static"

# Enable Node.js built-in module compatibility for Workers runtime
compatibility_flags = ["nodejs_compat"]

## [pages] table is not supported by this runner; using pages_build_output_dir instead

[vars]
MAILERLITE_GROUP_ID = "169680723602572313"

# Note: Pages config does not support account_id, triggers, or build/observability blocks

# D1 Database configuration for tracking robinhood clicks
[[d1_databases]]
binding = "DB"
database_name = "elchef-tracking"
database_id = "d126bbf9-5645-45de-a423-2ae12e6e8d60"

